/* Layout: the game fills the whole window. The canvas is sized to a whole number of screen pixels per game pixel,
   with only the story text, a language chip and a fullscreen chip laid over it. */
:root { --bg: #2b2233; --fg: #fff6e6; --font: 'VT323', ui-monospace, Menlo, Consolas, monospace; --u: 3; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2233; }
body { background: #2b2233; color: var(--fg); font-family: var(--font); font-size: 24px; line-height: 1.4; }
.frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); line-height: 0; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.ui { position: fixed; z-index: 5; top: max(8px, env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.chip { background: rgba(43, 34, 51, .72); border: 2px solid var(--fg); border-radius: 6px; padding: 3px 10px 4px; font-size: 21px; letter-spacing: .06em; cursor: pointer; line-height: 1.2; }
.chip:hover { background: var(--fg); color: #000; }
/* dialogue box, prompts and toasts, laid over the canvas */
.dlg {
  position: absolute; left: 0; top: 0; z-index: 3; --ax: 50%; cursor: pointer;
  width: max-content; max-width: min(calc(var(--u, 3) * 112px), calc(100% - 12px));
  background: #fff6e6; color: #3a2a3c; border: 4px solid #3a2a3c; border-radius: 26px;
  box-shadow: 0 0 0 3px #fff6e6, 0 5px 0 3px rgba(0,0,0,.4);
  padding: calc(var(--u, 3) * 3px) calc(var(--u, 3) * 5px) calc(var(--u, 3) * 2.4px); line-height: 1.3; text-align: left;
  font-size: max(23px, calc(var(--u, 3) * 8.1px)); font-weight: 600;
}
.dlg .dn {
  position: absolute; left: calc(var(--u, 3) * 4px); top: calc(var(--u, 3) * -7.5px); background: #c4565f; color: #fff6e6; border: 3px solid #3a2a3c; border-radius: 6px;
  padding: 0 calc(var(--u, 3) * 3px) 2px; font-size: max(18px, calc(var(--u, 3) * 6.0px)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3;
}
.dlg .dt { margin: 0; }
.dlg .rest { visibility: hidden; }
.dlg .dh { text-align: right; margin-top: calc(var(--u, 3) * 1px); font-size: max(17px, calc(var(--u, 3) * 4.8px)); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.dlg .dh::after { content: " \25BC"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dlg .dh::after { animation: none; } }
.prompt, .toast {
  position: absolute; left: 0; top: 0; pointer-events: none; background: #3a2a3c; color: #fff6e6; border: 2px solid #fff6e6;
  font-size: max(17px, calc(var(--u, 3) * 5.4px)); padding: 1px 6px 2px; white-space: nowrap; letter-spacing: .06em; text-transform: uppercase; line-height: 1.25;
}
/* tips and quest messages: same look as the walking hint (big plain text, no box) */
.toast { position: fixed; z-index: 4; left: 50%; top: min(24vh, 26%); transform: translateX(-50%); width: max-content; max-width: min(84vw, 900px); white-space: normal; text-align: center; text-transform: none; letter-spacing: .05em; font-weight: 400; line-height: 1.2; padding: 0; border: 0; background: none; color: #fff6e6; font-size: max(27px, calc(var(--u, 3) * 8px)); text-shadow: 0 3px 0 #2b2233, 0 -2px 0 #2b2233, 3px 0 0 #2b2233, -3px 0 0 #2b2233, 2px 2px 0 #2b2233, -2px 2px 0 #2b2233, 2px -2px 0 #2b2233, -2px -2px 0 #2b2233, 0 6px 14px rgba(0, 0, 0, .55); animation: hintin .6s ease-out both; transition: opacity .6s; }
.toast.off { opacity: 0; }
body.tc .toast { font-size: max(23px, calc(var(--u, 3) * 8px)); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; transition: none; } }


/* thought bubble above the player */
.think {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; --ax: 50%;
  width: max-content; max-width: min(calc(var(--u, 3) * 100px), calc(100% - 12px));
  background: #fff6e6; color: #3a2a3c; border: 4px solid #3a2a3c; border-radius: 28px;
  box-shadow: 0 0 0 3px #fff6e6, 0 5px 0 3px rgba(0,0,0,.45);
  padding: calc(var(--u, 3) * 3px) calc(var(--u, 3) * 5px) calc(var(--u, 3) * 3.4px);
  font-size: max(26px, calc(var(--u, 3) * 9.6px)); font-weight: 700; line-height: 1.25; text-align: center;
  animation: pop .28s cubic-bezier(.3,1.6,.5,1) both; transform-origin: var(--ax) 100%;
}
.think.out { opacity: 0; transition: opacity .3s; }
.think i, .dlg i { position: absolute; border: 3px solid #3a2a3c; background: #fff6e6; border-radius: 50%; box-shadow: 0 0 0 2px #fff6e6; }
.think .o1, .dlg .o1 { width: calc(var(--u, 3) * 4px); height: calc(var(--u, 3) * 4px); left: calc(var(--ax) - var(--u, 3) * 2px); bottom: calc(var(--u, 3) * -7px); }
.think .o2, .dlg .o2 { width: calc(var(--u, 3) * 2.4px); height: calc(var(--u, 3) * 2.4px); left: calc(var(--ax) + var(--u, 3) * 0.5px); bottom: calc(var(--u, 3) * -11.5px); }
@keyframes pop { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }
@media (prefers-reduced-motion: reduce) { .think { animation: none; } }


/* menu */
.mp { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(43, 34, 51, .62); padding: 16px; }
.mp[hidden] { display: none; }
.mc { width: min(320px, 100%); background: #fff6e6; color: #3a2a3c; border: 3px solid #3a2a3c; border-radius: 12px; box-shadow: 0 0 0 2px #fff6e6, 0 6px 0 2px rgba(0,0,0,.4); padding: 14px 16px 16px; display: grid; gap: 8px; }
#dp .mc { width: min(600px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
.dlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
.dh { grid-column: 1 / -1; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin: 6px 0 0; }
#dp .mb { font-size: 21px; padding: 6px 10px 5px; }
.mtt { margin: 0 0 2px; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.mb { background: #f1e6d4; color: #3a2a3c; border: 2px solid #3a2a3c; border-radius: 8px; border-bottom-width: 4px; padding: 8px 12px 7px; font-size: 24px; font-weight: 500; text-align: left; cursor: pointer; width: 100%; }
.mb:hover { background: #f3d98a; }
.mb.prim { background: #c4565f; color: #fff6e6; text-align: center; font-weight: 700; margin-top: 4px; }
.mb.prim:hover { background: #d4666f; }
.mb.warn { background: #e8b4b0; }
.mb:focus-visible { outline: 3px solid #c4565f; outline-offset: 2px; }
.rc { display: grid; gap: 6px; background: #f6dcd8; border: 2px solid #3a2a3c; border-radius: 8px; padding: 8px; }
.rc[hidden] { display: none; }
.rq { font-size: 21px; font-weight: 500; line-height: 1.3; }
.rr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rr .mb { text-align: center; }

/* quest card, top left */
.quest {
  position: fixed; z-index: 4; left: max(10px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
  width: max-content; max-width: min(300px, calc(100vw - 200px)); pointer-events: auto; transition: opacity .7s;
  background: #fff6e6; color: #3a2a3c; border: 3px solid #3a2a3c; border-radius: 10px; box-shadow: 0 0 0 2px #fff6e6, 0 4px 0 2px rgba(0,0,0,.4);
  padding: 7px 12px 8px; line-height: 1.25; animation: slide .45s cubic-bezier(.3,1.4,.5,1) backwards;
}
.quest[hidden] { display: none; }
.quest.dim { opacity: .16; }
.quest .qt { display: inline-block; background: #c4565f; color: #fff6e6; border: 2px solid #3a2a3c; border-radius: 4px; padding: 0 7px 1px; font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.quest .qh { font-size: 24px; font-weight: 700; }
.quest .qs { font-size: 20px; font-weight: 500; opacity: .85; margin-top: 1px; }
.quest .qs:empty { display: none; }
.quest .qp { display: flex; gap: 4px; margin-top: 6px; }
.quest .qp:empty { display: none; }
.quest .qp i { width: 14px; height: 14px; border: 2px solid #3a2a3c; border-radius: 50%; background: #e6dcea; display: block; }
.quest.flash { animation: slide .45s cubic-bezier(.3,1.4,.5,1) backwards, glow 1.4s ease-out; }
@keyframes slide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0% { box-shadow: 0 0 0 2px #fff6e6, 0 0 0 7px #f3d98a, 0 4px 0 2px rgba(0,0,0,.4); } 100% { box-shadow: 0 0 0 2px #fff6e6, 0 0 0 2px #f3d98a, 0 4px 0 2px rgba(0,0,0,.4); } }
