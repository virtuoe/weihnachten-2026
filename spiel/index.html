::after{box-sizing:inherit}\nbody{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n[hidden]{display:none!important}\nbutton{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}\n:focus-visible{outline:2px solid var(--fg);outline-offset:4px}\np,h1,h2,ul,dl,dd{margin:0}\n\n.app{position:relative;height:100%;overflow:hidden;background:var(--bg)}\n#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}\n#stage.dragging{cursor:grabbing}\n#stage:focus-visible{outline:none}\n\n.chrome{position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;\n  padding-left:max(16px,var(--m),env(safe-area-inset-left,0px));\n  padding-right:max(16px,var(--m),env(safe-area-inset-right,0px));\n  padding-block:clamp(14px,5.28vh,57px) clamp(12px,5.65vh,61px)}\n.chrome button{pointer-events:auto}\n.zones{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.054fr);column-gap:var(--gut);align-items:center}\n.tick{display:inline-block;width:2px;height:var(--tick);background:var(--fg);flex:none}\n.nav{display:flex;align-items:center;gap:clamp(8px,0.73vw,14px)}\n.nav-label{font-size:var(--t-label);font-weight:700;letter-spacing:.02em;text-transform:uppercase;min-width:clamp(52px,6.6vw,126px)}\n.nav-nums{display:flex}\n.nav-nums button{font-size:var(--t-nav);letter-spacing:.06em;width:clamp(22px,1.8vw,34.6px);text-align:left;color:var(--dim);font-variant-numeric:tabular-nums;padding-block:6px}\n.nav-nums button.open{color:var(--muted)}\n.nav-nums button.on{color:var(--fg);font-weight:700}\n.nav-nums button:disabled{cursor:default}\n.nav-nums button.open:not(.on):hover{color:var(--fg)}\n.topmain{display:flex;align-items:center;justify-content:space-between;gap:var(--gut);min-width:0}\n.chapter{display:flex;align-items:center;gap:clamp(8px,0.73vw,14px);min-width:0}\n.chapter span:last-child{font-size:var(--t-nav);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.score{display:flex;align-items:baseline;gap:clamp(8px,0.73vw,14px);white-space:nowrap}\n.score-label{font-size:var(--t-nav);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.score-val{font-size:var(--t-label);font-weight:700;font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}\n.bottom{align-items:end}\n.mark{display:block;color:var(--fg)}\n.mark-sm{width:clamp(30px,2.344vw,45px);height:auto}\n.botmain{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--gut);min-width:0}\n.hint{font-size:var(--t-cap);color:var(--muted);line-height:1.3;min-width:0}\n.controls{display:flex;gap:clamp(12px,1.25vw,24px);flex-wrap:wrap;justify-content:flex-end}\n.controls button{font-size:var(--t-nav);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:6px;white-space:nowrap}\n.controls button:hover{color:var(--fg)}\n.app.on-cover .topbar,.app.on-cover .mark-sm,.app.on-cover .hint,.app.on-cover #btnRestart{visibility:hidden}\n\n.screen{position:absolute;inset:0;z-index:2;\n  padding-left:max(16px,var(--m),env(safe-area-inset-left,0px));\n  padding-right:max(16px,var(--m),env(safe-area-inset-right,0px))}\n.cover{display:flex;flex-direction:column;justify-content:space-between;gap:clamp(28px,5vh,64px);\n  bottom:calc(clamp(12px,5.65vh,61px) + 46px);\n  padding-block:clamp(18px,8.33vh,90px) clamp(16px,6vh,96px);overflow-y:auto}\n.mark-lg{width:clamp(64px,6.458vw,124px);height:auto;flex:none}\n.cover-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.054fr);column-gap:var(--gut);row-gap:clamp(40px,6vh,64px);align-items:end}\n.cover-text{display:flex;flex-direction:column;gap:clamp(14px,1.25vw,24px)}\n.cover-meta{font-s px;bottom:4px;animation:bob .8s infinite steps(2)}\n@keyframes bob{50%{transform:translateY(3px)}}\n#bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:26px;font-size:19px;color:#cdbad8}\n#bar b{color:#ffd34a;font-weight:400}\n#bar button{font-family:'Silkscreen',monospace;font-size:12px;background:#3a2c4c;color:#fff6df;border:2px solid #6a5580;padding:4px 10px;cursor:pointer}\n#pad{display:none;position:fixed;left:0;right:0;bottom:10px;justify-content:space-between;padding:0 14px;pointer-events:none}\n#pad div{display:flex;gap:8px}\n#pad button{pointer-events:auto;width:54px;height:54px;font-size:22px;border-radius:10px;background:rgba(58,44,76,.85);color:#fff6df;border:2px solid #6a5580;touch-action:none}\n@media (pointer:coarse){#pad{display:flex}#bar .keys{display:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"room\">\n  \u003ch1>KLANGHAUS\u003csmall>ein Haus voller Klang – am Hang, mit Hühnern\u003c/small>\u003c/h1>\n  \u003cdiv id=\"frame\">\n    \u003cdiv id=\"view\">\n      \u003ccanvas id=\"c\">\u003c/canvas>\n      \u003cdiv id=\"ui\">\n        \u003cdiv id=\"dialog\">\u003cdiv class=\"who\">\u003c/div>\u003cdiv class=\"txt\">\u003c/div>\u003cdiv class=\"more\">▼\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"sill\">\u003cdiv class=\"mug\">\u003c/div>\u003cdiv class=\"pot\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"bar\">\n    \u003cspan class=\"keys\">\u003cb>← →\u003c/b> laufen · \u003cb>↑ ↓\u003c/b> Treppe · \u003cb>E\u003c/b>/\u003cb>Leertaste\u003c/b> sprechen &amp; benutzen · \u003cb>Klick\u003c/b> zum Hinlaufen\u003c/span>\n    \u003cbutton id=\"mute\">♪ Ton an\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"pad\">\n  \u003cdiv>\u003cbutton data-k=\"ArrowLeft\">◀\u003c/button>\u003cbutton data-k=\"ArrowRight\">▶\u003c/button>\u003c/div>\n  \u003cdiv>\u003cbutton data-k=\"ArrowUp\">▲\u003c/button>\u003cbutton data-k=\"ArrowDown\">▼\u003c/button>\u003cbutton data-k=\"e\">E\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* =====================================================================\n   CHARAKTERE – hier anpassen (Namen/Rollen/Texte des echten Teams)\n   ===================================================================== */\nconst TEAM = [\n  { id:'mara', name:'Mara', role:'Creative Direction & Sound Branding', voice:520,\n    look:{skin:'#f1c7a3',hair:'#d9562b',style:'short',shirt:'#1f9e8f',accent:'#f6d38a',pants:'#2b2a3a',shoes:'#1a1420',glasses:true},\n    home:{floor:1,x:234,sit:true,facing:1,act:'hört gerade einen Mix im Atmos-Studio'},\n    lines:['Ich kümmere mich um Sound-Branding: Wie klingt eine Marke – und warum?',\n           'Ein gutes Audio-Logo erkennt man nach zwei Sekunden wieder. Das ist die ganze Kunst.',\n           'Geh mal ins Atmos-Studio an die Konsole. Da kommt der Klang plötzlich auch von oben.'],\n    solo:['Hmm… die Marke braucht mehr Wärme.','Zwei Sekunden. Mehr brauchen wir nicht.'] },\n  { id:'ben', name:'Ben', role:'Komposition & Musikproduktion', voice:300,\n    look:{skin:'#e0ac85',hair:'#3a2a1e',style:'short',beanie:'#e8b04a',beard:true,shirt:'#c4475a',accent:'#ffd34a',pants:'#3a4a6a',shoes:'#2a1d22'},\n    home:{floor:0,x:206,sit:true,facing:1,act:'nimmt gerade in Studio A auf'},\n    lines:['Ich komponiere – vom 3-Sekunden-Jingle bis zum ganzen Score.',\n           'Studio A ist mein Wohnzimmer. Das Ampli dahinten ist älter als ich.',\n           'Die Hühner draußen haben erstaunlich gutes Timing. Ich sample sie heimlich.'],\n    solo:['Noch ein Take…','Wer hat mein Plektrum gesehen?'] },\n  { id:'lea', name:'Lea', role:'Sounddesign (UX- & Produktklänge)', voice:640,\n    look:{skin:'#c98b62',hair:'#7b4bd1',style:'long',headphones:'#f4f4f0',shirt:'#f2b84b',accent:'#e8556a',pants:'#26314a',shoes:'#f4f4f0'},\n    home:{floor:0,x:285,sit:true,facing:1,act:'baut gerade Produktsounds in Studio B'},\n    lines:['Ich mache Klänge für Produkte: Wie piept ein Herd? Wie summt ein E-Auto beim Anfahren?',\n           'Ein guter Bestätigungston ist kurz, freundlich und nervt auch beim tausendsten Mal nicht.',\n           'Gestern hab ich 40 Minuten eine Kaffeetasse aufgenommen. Bestes Sample der Woche.'],\n    solo:['Zu spitz. Nochmal.','*bliep* … *blööp* … ja!'] },\n  { id:'tom', name:'Tom', role:'Mixing, Mastering & Dolby Atmos', voice:240,\n    look:{skin:'#f3d0b0',hair:'#e8d27a',style:'short',headphones:'#2a2a35',shirt:'#34344a',accent:'#5ad1ff',pants:'#4a4a5a',shoes:'#1a1420'},\n    home:{floor:1,x:253,sit:true,facing:1,act:'mischt gerade in 7.1.4'},\n    lines:['7.1.4 heißt: sieben Lautsprecher um dich herum, ein Sub und vier an der Decke.',\n           'Alle Lautsprecher hier sind weiß. Fragt nicht. Sieht einfach gut aus.',\n           'Im Atmos-Mix ist jeder Klang ein Objekt im Raum. Ich schiebe gerade eine Möwe nach hinten links.'],\n    solo:['Der Sub braucht noch 0,5 dB.','Objekt 12 … nach oben.'] },\n  { id:'sophie', name:'Sophie', role:'Projektmanagement & Kundenberatung', voice:560,\n    look:{skin:'#8d5a3b',hair:'#1b1418',style:'curly',shirt:'#e85a8a',accent:'#fff6df',pants:'#efe3c8',shoes:'#c4475a'},\n    home:{floor:0,x:354,sit:true,facing:1,act:'plant gerade Projekte auf der Terrasse'},\n    lines:['Ich übersetze zwischen Kunden und Studio. „Mehr Wumms“ heißt meistens: tiefer, kürzer, lauter.',\n           'Bester Arbeitsplatz im Haus: der große Tisch auf der Terrasse, mit Blick über den Hang.',\n           'Deadline ist Freitag. Also… eigentlich Donnerstag.'],\n    solo:['Call um drei, Review um vier.','Die Aussicht hier ist unfair gut.'] },\n  { id:'kai', name:'Kai', role:'Audio-Entwicklung & interaktive Sounds', voice:400,\n    look:{skin:'#f0c09a',hair:'#6b4a2e',style:'bun',glasses:true,shirt:'#4a7de0',accent:'#9bff6a',pants:'#2a2a2a',shoes:'#e8e4da'},\n    home:{floor:1,x:186,sit:false,facing:1,act:'repariert gerade die Kaffeemaschine'},\n    lines:['Ich bringe Sounds in Apps, Games und Geräte – damit sie im richtigen Moment richtig klingen.',\n           'Die Kaffeemaschine hat einen eigenen Sound bekommen. Sie weiß es noch nicht.',\n           'Die zwei oberen Etagen? Sind zu. Da wohnen nur Kabel und Erinnerungen.'],\n    solo:['Wer hat den letzten Kaffee genommen?','Kompiliert… kompiliert… läuft!'] },\n];\n\nconst CONVS = [\n  ['Hast du den neuen Jingle gehört?','Ja! Der Shaker in Takt 3 ist magisch.','Magisch oder zu laut?','…beides.'],\n  ['Wer hat die letzte Kaffeebohne genommen?','Ich schwöre, das war das Atmos-Studio.','Das Atmos-Studio trinkt keinen Kaffee.','In 7.1.4 schon.'],\n  ['Der Kunde will den Sound „blauer“.','Blau wie Ozean oder blau wie Montag?','Wie Ozean am Montag.','Ich hol den Hall raus.'],\n  ['Ich hab ein Huhn aufgenommen. Für die Library.','Und?','Perfekter Transient. 10 von 10.','Wir brauchen eine Kategorie „Huhn“.'],\n  ['Mittag auf der Terrasse?','Nur wenn wir über Kompressoren reden.','Ratio 4:1 zum Nachtisch?','Deal.'],\n  ['Die Höhen klingen heute anders.','Ich hab die Lautsprecher geputzt.','Die sind doch eh weiß.','Jetzt sind sie WEISSER.'],\n  ['Kannst du kurz in den Mix reinhören?','Klar. … Ist das eine Fahrradklingel?','Unser neues Markenmotiv.','Mutig. Ich mag’s.'],\n  ['Der Deckenlautsprecher hinten links zirpt.','Das ist die Grille draußen.','Ah. Dann lass ich sie drin.','Organisches Immersive Audio.'],\n  ['Wie klingt eigentlich ein Logo?','Wie es sich anfühlt.','Und wie fühlt sich unseres an?','Wie ein Hang voller Hühner bei Sonnenuntergang.'],\n  ['Feierabend?','Erst nach dem Bounce.','Der Bounce dauert 40 Minuten.','Dann Feierabend in 41.'],\n  ['Ich brauch einen Sound für „Erfolg“.','Dur, aufsteigend, kurz.','Und für „fast Erfolg“?','Gleiches Motiv, letzter Ton fehlt.'],\n];\n\n/* =====================================================================\n   SETUP\n   ===================================================================== */\nconst W=480, H=270;\nconst cv=document.getElementById('c'); cv.width=W; cv. t byId=id=>npcs.find(n=>n.id===id);\nfunction say(a,txt,dur){a.bubble={text:txt,until:T+dur};}\n\nconst chats=[];\nfunction think(n,dt){\n  if(n.mode==='player'||n.mode==='chat')return;\n  if(n.mode==='wait'){n.waitT=(n.waitT||0)+dt;if(n.waitT>22){n.mode='free';n.timer=1;}return;}\n  if(n.mode==='approach'){n.apT+=dt;if(n.apT>25||!n.partner||n.partner.mode!=='wait'){n.mode='free';n.goal=null;n.timer=1;if(n.partner&&n.partner.mode==='wait')n.partner.mode='free';}return;}\n  if(n.goal||n.climb)return;\n  n.timer-=dt;if(n.timer>0)return;\n  const r=Math.random();\n  if(r\u003c.38){ // work at home spot\n    n.setGoal(n.home.floor,n.home.x,()=>{n.sitting=n.home.sit;n.facing=n.home.facing;n.activity=n.home.act;n.timer=rand(9,18);if(Math.random()\u003c.35)say(n,pick(n.solo),3);});\n  }else if(r\u003c.53&&n.id!=='kai'){ // coffee\n    n.setGoal(1,rand(196,203),()=>{n.facing=1;n.activity='holt sich gerade Kaffee';n.timer=rand(4,7);if(Math.random()\u003c.5)say(n,pick(['Kaffee…','Noch einer geht.','Espresso-Zeit!']),2.5);});\n  }else if(r\u003c.86){ // chat with someone\n    const free=npcs.filter(o=>o!==n&&o.mode==='free'&&!o.climb);\n    if(!free.length){n.timer=2;return;}\n    const p=pick(free);p.mode='wait';p.waitT=0;p.goal=null;\n    n.mode='approach';n.partner=p;n.apT=0;\n    const side=(n.floor===p.floor?Math.sign(n.x-p.x):(p.x>(RANGE[p.floor][0]+RANGE[p.floor][1])/2?-1:1))||1;\n    let tx=p.x+side*10;if(tx\u003cRANGE[p.floor][0]||tx>RANGE[p.floor][1])tx=p.x-side*10;\n    n.setGoal(p.floor,tx,()=>startChat(n,p));\n  }else{ // wander / look outside\n    const f=n.floor;n.setGoal(f,rand(RANGE[f][0]+4,RANGE[f][1]-4),()=>{n.timer=rand(2,5);n.activity='schaut sich gerade um';});\n  }\n}\nfunction startChat(a,b){\n  if(b.mode!=='wait'||a.mode!=='approach'){a.mode='free';a.timer=1;return;}\n  a.mode=b.mode='chat';a.facing=Math.sign(b.x-a.x)||1;b.facing=-a.facing;\n  a.activity=b.activity='quatscht gerade';\n  chats.push({a,b,lines:pick(CONVS),i:0,next:T+.2});\n}\nfunction endChat(c){const i=chats.indexOf(c);if(i>=0)chats.splice(i,1);[c.a,c.b].forEach(n=>{if(n.mode==='chat'){n.mode='free';n.timer=rand(1,4);}});}\nfunction updateChats(){for(const c of chats.slice()){if(T\u003cc.next)continue;if(c.i>=c.lines.length){endChat(c);continue;}\n  const sp=c.i%2?c.b:c.a,txt=c.lines[c.i],d=2+txt.length*.045;say(sp,txt,d);c.next=T+d+.25;c.i++;}}\nfunction grab(n){\n  const c=chats.find(c=>c.a===n||c.b===n);if(c){n.mode='player';endChat(c);}\n  if(n.mode==='approach'&&n.partner&&n.partner.mode==='wait'){n.partner.mode='free';n.partner.timer=1;}\n  npcs.forEach(o=>{if(o.mode==='approach'&&o.partner===n){o.mode='free';o.goal=null;o.timer=1;}});\n  n.mode='player';n.goal=null;n.bubble=null;n.facing=Math.sign(player.x-n.x)||1;player.facing=-n.facing;\n}\n\n/* chickens */\nconst chickens=[];\nconst CHCOL=['#f7f3ea','#f7f3ea','#c4733a','#f7f3ea','#2b2b2b','#d9a066','#f7f3ea','#c4733a'];\nfor(let i=0;i\u003c9;i++){const left=i\u003c3;chickens.push({x:left?rand(12,104):rand(338,470),min:left?10:336,max:left?106:472,dir:Math.random()\u003c.5?-1:1,st:'idle',t:rand(0,2),col:CHCOL[i],jump:0,vy:0,bubble:null});}\nfunction updateChickens(dt){for(const c of chickens){\n  c.t-=dt;if(c.jump>0||c.vy){c.vy+=200*dt;c.jump=Math.max(0,c.jump-c.vy*dt);if(c.jump\u003c=0){c.jump=0;c.vy=0;}}\n  if(c.t\u003c=0){const r=Math.random();c.st=r\u003c.4?'walk':r\u003c.75?'peck':'idle';c.t=c.st==='walk'?rand(.8,2.5):rand(.6,2);if(c.st==='walk'&&Math.random()\u003c.4)c.dir*=-1;}\n  if(c.st==='walk'){c.x+=c.dir*9*dt;if(c.x\u003cc.min||c.x>c.max){c.dir*=-1;c.x=clamp(c.x,c.min,c.max);}}}}\nfunction drawChicken(c){\n  const x=Math.round(c.x),y=groundY(c.x)+1-Math.round(c.jump),f=c.dir,P=(dx,dy,w,h,col)=>R(f>0?x+dx:x-dx-w+1,y+dy,w,h,col);\n  const peck=c.st==='peck'&&Math.floor(T*6)%2===0;const dk=c.col==='#2b2b2b'?'#1a1a1a':(c.col==='#f7f3ea'?'#d8d2c4':'#9a5228');\n  P(-1,-2,1,2,'#f2a23a');P(1,-2,1,2,'#f2a23a');\n  P(-2,-6,5,4,c.col);P(-3,-7,2,3,c.col);P(-1,-5,3,1,dk);\n  if(peck){P(3,-4,2,2,c.col);P(5,-3,1,1,'#f2a23a');P(3,-5,1,1,'#e23b3b');}\n  else{P(2,-8,2,3,c.col);P(4,-7,1,1,'#f2a23a');P(2,-9,2,1,'#e23b3b');P(3,-7,1,1,'#1a1420');P(3,-5,1,1,'#e23b3b');}\n}\n\n/* =====================================================================\n   CHARACTER SPRITE\n   ===================================================================== */\nconst dark=(c,k=.75)=>{const [r,gg,b]=hex(c);return `rgb(${r*k|0},${gg*k|0},${b*k|0})`;};\nfunction drawChar(a){\n  const x=Math.round(a.x),y=Math.round(a.y),f=a.facing||1,L=a.look;\n  const P=(dx,dy,w,h,c)=>R(f>0?x+dx:x-dx-w+1,y+dy,w,h,c);\n  const walking=a.walking,fr=walking?Math.floor(a.anim*8)%4:0,oy=walking&&fr%2===1?-1:0;\n  ctx.globalAlpha=.25;R(x-3,y,7,1,'#000');ctx.globalAlpha=1;\n  if(a.sitting){P(-1,-4,5,2,L.pants);P(2,-2,2,1,L.pants);P(2,-1,3,1,L.shoes);}\n  else if(fr%2===1){P(-2,-4,2,1,dark(L.pants));P(-3,-3,2,2,dark(L.pants));P(-4,-1,2,1,L.shoes);P(1,-4,2,1,L.pants);P(2,-3,2,2,L.pants);P(3,-1,2,1,L.shoes);}\n  else{P(-1,-4,3,3,L.pants);P(-1,-1,3,1,L.shoes);if(!walking){P(-2,-4,1,3,L.pants);P(-2,-1,1,1,L.shoes);}}\n  // torso\n  P(-2,-9+oy,5,5,L.shirt);P(-2,-9+oy,1,5,dark(L.shirt));P(0,-9+oy,2,1,L.accent);\n  if(L.scarf){P(-1,-9+oy,4,1,'#e8556a');P(-2,-8+oy,1,2,'#e8556a');}\n  const typing=a.sitting&&a.mode==='free'&&!a.goal;\n  if(typing){P(1,-7+oy,3,1,dark(L.shirt,.85));P(4,-7+oy,1,1,L.skin);}\n  else{const sw=walking?(fr===1?1:fr===3?-1:0):0;P(sw,-8+oy,1,3,dark(L.shirt,.85));P(sw,-5+oy,1,1,L.skin);}\n  // head\n  P(-2,-14+oy,5,5,L.skin);P(3,-12+oy,1,1,L.skin);P(-2,-14+oy,1,5,dark(L.skin,.9));\n  const blink=Math.floor(T*2+a.x)%9===0;\n  P(1,-12+oy,1,1,blink?L.skin:'#1a1420');\n  const talking=a.bubble&&T\u003ca.bubble.until&&Math.floor(T*8)%2===0;\n  if(talking)P(1,-10+oy,2,1,'#7a2a2a');\n  const h=L.hair;\n  if(L.style==='curly'){P(-3,-16+oy,6,3,h);P(-3,-13+oy,2,3,h);P(3,-15+oy,1,1,h);P(-4,-14+oy,1,2,h);}\n  else{P(-2,-15+oy,5,2,h);P(-2,-13+oy,1,2,h);\n    if(L.style==='long'){P(-3,-14+oy,1,7,h);P(-2,-11+oy,1,4,h);}\n    if(L.style==='bun'){P(-3,-17+oy,3,2,h);}}\n  if(L.beard){P(-1,-11+oy,4,2,h);if(talking)P(1,-10+oy,2,1,'#7a2a2a');}\n  if(L.beanie){P(-2,-17+oy,5,2,L.beanie);P(-3,-15+oy,6,1,dark(L.beanie));P(-1,-18+oy,2,1,L.beanie);}\n  if(L.glasses){P(0,-12+oy,3,1,'#121018');P(1,-12+oy,1,1,'#bfe8ff');}\n  if(L.headphones){P(-2,-16+oy,5,1,L.headphones);P(-1,-13+oy,2,3,L.headphones);}\n}\n\n/* =====================================================================\n   DYNAMIC LAYER\n   ===================================================================== */\nlet playing=0;\nconst smoke=[],notes=[],flies=[];\nfor(let i=0;i\u003c16;i++){const x=rand(10,470);flies.push({x,y:groundY(x)-rand(4,30),ph:rand(0,6),vx:rand(-3,3),vy:rand(-2,2)});}\nlet smokeT=0;\nfunction drawDynamic(dt){\n  ctx=g;\n  // twinkle stars\n  for(let i=0;i\u003c6;i++){const s=Math.sin(T*1.7+i*2.1);if(s>.6)R((i*83+40)%W,(i*29+8)%70,1,1,'rgba(255,255,255,.9)');}\n  // smoke\n  smokeT-=dt;if(smokeT\u003c=0){smokeT=.35;smoke.push({x:272+rand(-1,1),y:6,vx:rand(2,5),vy:rand(-7,-5),life:0});}\n  for(const p of smoke.slice()){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life>4){smoke.splice(smoke.indexOf(p),1);continue;}\n    const s=2+Math.floor(p.life);ctx.globalAlpha=.4*(1-p.life/4);R(p.x,p.y,s,s,'#d8d4e4');ctx.globalAlpha=1;}\n  // Atmos screen\n  R(253,108,52,15,'#0d0b16');\n  const tc=['#ff6ad5','#5ad1ff','#ffd34a','#9bff6a','#ff9a3c'];\n  for(let r=0;r\u003c5;r++){for(let k=0;k\u003c6;k++){const x0=253+((k*13+r*7-T*(playing?14:4))%78+78)%78-10;const w=6+((k+r)%3)*3;\n    const xa=Math.max(253,x0),xb=Math.min(305,x0+w);if(xb>xa)R(xa,109+r*3,xb-xa,2,tc[(k+r)%5]);}}\n  R(253+((T*(playing?20:6))%52),108,1,15,'#ffffff');\n  // console meters\n  for(let i=0;i\u003c10;i++){const lv=playing?Math.abs(Math.sin(T*9+i*1.7))*3+1:Math.abs(Math.sin(T*1.5+i))*1.2+.5;\n    for(let k=0;k\u003cMath.round(lv);k++)R(260+i*4,136-k,2,1,k>=3?'#ff3b3b':k>=2?'#ffd34a':'#9bff6a');}\n  for(let i=0;i\u003c10;i++)R(260+i*4,138,2,1,i%3?'#cfd2d6':'#ff9a3c');\n  // studio monitors\n  R(221,179,10,7,'#101a2a');for(let i=0;i\u003c10;i++){const h=Math.round(Math.abs(Math.sin(T*3+i*.8))*3);R(221+i,182-h,1,h*2+1,'#5ad1ff');}\n  R(299,176,16,9,'#141024');for(let i=0;i\u003c4;i++){const x0=299+((i*7-T*5)%20+20)%20;R(Math.min(x0,313),177+i*2,3,1,tc[i]);}\n  R(299+((T*4)%16),176,1,9,'#fff6df');\n  // ON AIR\n  const ben=byId('ben');const onair=ben&&ben.sitting&&ben.x===ben.home.x&&ben.floor===0;\n  R(211,152,26,6,onair&&Math.floor(T*1.5)%2===0?'#ff3b3b':'#4a1a1e');text('ON AIR',212,152,onair?'#fff6df':'#7a3a3e');\n  if(onair){ctx.globalAlpha=.15;R(206,149,36,12,'#ff3b3b');ctx.globalAlpha=1;}\n  // speakers pulse when playing\n  if(playing>0){const on=Math.floor(T*10)%2===0;for(const s of speakers){if(on)R(s.x-(s.big?1:0),s.y,s.big?3:2,s.big?3:2,'#7a7f8c');}\n    ctx.globalAlpha=.07+.05*Math.sin(T*8);R(219,100,107,46,'#ff6ad5');ctx.globalAlpha=1;\n    if(Math.random()\u003cdt*4)notes.push({x:rand(230,320),y:rand(115,135),life:0,c:pick(tc)});}\n  for(const n of notes.slice()){n.life+=dt;n.y-=8*dt;n.x+=Math.sin(n.life*4)*.2;if(n.life>2.2){notes.splice(notes.indexOf(n),1);continue;}\n    ctx.globalAlpha=1-n.life/2.2;R(n.x,n.y+3,2,2,n.c);R(n.x+1,n.y,1,4,n.c);R(n.x+2,n.y,1,1,n.c);ctx.globalAlpha=1;}\n  // coffee steam\n  if(Math.floor(T*3)%3!==0)R(213,131-((T*4)%3),1,1,'rgba(255,255,255,.5)');\n  // string lights\n  const x0=334,y0=157,x1=393,y1=152;\n  for(let i=0;i\u003c=59;i++){const u=i/59;R(lerp(x0,x1,u),lerp(y0,y1,u)+Math.sin(u*Math.PI)*7,1,1,'#2a2032');}\n  const bc=['#ffd34a','#ff6a8a','#5ad1ff','#9bff6a'];\n  for(let i=1;i\u003c10;i++){const u=i/10,bx=lerp(x0,x1,u),by=lerp(y0,y1,u)+Math.sin(u*Math.PI)*7+1;const on=Math.sin(T*2+i*1.3)>-.6;\n    if(on){ctx.globalAlpha=.18;disc(Math.round(bx),Math.round(by),2,bc[i%4]);ctx.globalAlpha=1;}R(bx,by,1,2,on?bc[i%4]:'#4a3a4a');}\n  // candle flicker\n  ctx.globalAlpha=.25+.1*Math.sin(T*13);disc(377,182,3,'#ffd34a');ctx.globalAlpha=1;\n  // chickens\n  chickens.forEach(drawChicken);\n}\nfunction drawFireflies(dt){\n  for(const f of flies){f.ph+=dt;f.x+=(f.vx+Math.sin(f.ph*.7)*3)*dt;f.y+=(f.vy+Math.cos(f.ph*.9)*2)*dt;\n    if(f.x\u003c0)f.x=W;if(f.x>W)f.x=0;const gy=groundY(f.x);if(f.y>gy-2)f.y=gy-2;if(f.y\u003cgy-40)f.y=gy-40;\n    if(f.x>116&&f.x\u003c330&&f.y\u003c200)continue;\n    const b=Math.sin(f.ph*2.3);if(b>.2){ctx.globalAlpha=.25*b;disc(Math.round(f.x),Math.round(f.y),2,'#eaff8a');ctx.globalAlpha=1;R(f.x,f.y,1,1,'#f6ffb0');}}\n}\n\n/* =====================================================================\n   UI (bubbles, dialog, hints)\n   ===================================================================== */\nconst ui=document.getElementById('ui'),dlgEl=document.getElementById('dialog'),whoEl=dlgEl.querySelector('.who'),txtEl=dlgEl.querySelector('.txt');\nlet S=3;\nconst els=new Map();\nfunction el(key,cls){let e=els.get(key);if(!e){e=document.createElement('div');e.className=cls;ui.insertBefore(e,dlgEl);els.set(key,e);}return e;}\nfunction place(e,x,y){const vx=clamp(x*S,40,W*S-40);e.style.left=vx+'px';e.style.top=(y*S)+'px';e.style.display='block';}\nconst hide=k=>{const e=els.get(k);if(e)e.style.display='none';};\n\nlet dlg=null;\nfunction openTalk(n){\n  grab(n);\n  const L=[];\n  if(!n.talked)L.push(`Hey! Ich bin ${n.name} – ${n.role}.`);else L.push(pick(['Na, wieder da?','Oh, hallo nochmal!','Was gibt’s?']));\n  L.push(n.lines[n.talked%n.lines.length]);\n  if(n.talked===0)L.push(n.lines[1]);\n  L.push(n.sitting?'Ich muss gleich weitermachen – aber schau dich ruhig um!':pick(['Schau dich ruhig um!','Viel Spaß im Klanghaus!','Grüß die Hühner von mir.']));\n  n.talked++;\n  dlg={npc:n,name:n.name,role:n.role,lines:L,i:0,c:0};\n  showDlg();\n}\nfunction narrate(lines,name='★'){dlg={npc:null,name,role:'',lines:[].concat(lines),i:0,c:0};showDlg();}\nfunction showDlg(){dlgEl.style.display='block';whoEl.innerHTML=dlg.name+(dlg.role?`\u003cspan>${dlg.role}\u003c/span>`:'');}\nfunction advance(){if(!dlg)return;const full=dlg.lines[dlg.i];if(dlg.c\u003cfull.length){dlg.c=full.length;return;}\n  dlg.i++;dlg.c=0;if(dlg.i>=dlg.lines.length){if(dlg.npc){dlg.npc.mode='free';dlg.npc.timer=rand(1.5,3);\n    if(dlg.npc.sitting===false&&dlg.npc.home.sit)dlg.npc.timer=.5;}dlg=null;dlgEl.style.display='none';}}\nlet blipAcc=0;\nfunction updateDlg(dt){if(!dlg)return;const full=dlg.lines[dlg.i];if(dlg.c\u003cfull.length){dlg.c=Math.min(full.length,dlg.c+dt*48);blipAcc+=dt;\n  if(blipAcc>.07){blipAcc=0;if(full[Math.floor(dlg.c)]!==' ')blip(dlg.npc?dlg.npc.voice:700);}}\n  txtEl.textContent=full.slice(0,Math.floor(dlg.c));}\n\n/* interactables */\nconst OBJ=[\n  {floor:1,x:280,label:'Atmos-Mix abspielen',act:()=>{soundLogo();playing=5;narrate(['Du drückst Play. Der Raum füllt sich mit 7.1.4 – Klang von vorne, hinten und von der Decke.','Irgendwo hinten links gackert ein Huhn. Im Mix. Absichtlich.']);}},\n  {floor:1,x:210,label:'Espresso machen',act:()=>{hiss();narrate('Zisch… brrrr… Espresso fertig. Die Maschine piept in perfektem C-Dur.');}},\n  {floor:0,x:182,label:'Ins Mikro singen',act:()=>{tone(220,0,.5,'triangle',.06);tone(277,.25,.5,'triangle',.06);tone(330,.5,.8,'triangle',.06);narrate('„Laaa~“ – Der Kompressor ist beeindruckt. Ben weniger.');}},\n  {floor:0,x:269,label:'Synth spielen',act:()=>{chord();narrate('Ein warmer Akkord wabert durch Studio B. Lea nickt anerkennend.');}},\n  {floor:0,x:368,label:'Aussicht genießen',act:()=>{narrate(['Der Blick geht über den Hang hinunter ins Tal. Die Hühner ignorieren dich souverän.','Über dir leuchten die Lichterketten.']);}},\n  {floor:0,x:247,label:'Gitarre anschauen',act:()=>{tone(196,0,1,'triangle',.05);tone(247,.05,1,'triangle',.04);tone(294,.1,1,'triangle',.04);narrate('Eine alte Sunburst-Gitarre. Jemand hat „NICHT STIMMEN“ auf einen Zettel geschrieben.');}},\n];\n\n/* =====================================================================\n   INPUT\n   ===================================================================== */\nconst keys=new Set();\nfunction nearestNPC(){let best=null,bd=13;for(const n of npcs){if(n.climb||n.floor!==player.floor||player.climb)continue;const d=Math.abs(n.x-player.x);if(d\u003cbd){bd=d;best=n;}}return best;}\nfunction nearestObj(){if(player.climb)return null;let best=null,bd=9;for(const o of OBJ){if(o.floor!==player.floor)continue;const d=Math.abs(o.x-player.x);if(d\u003cbd){bd=d;best=o;}}return best;}\nfunction interact(){audio();if(dlg){advance();return;}const n=nearestNPC();if(n){openTalk(n);return;}const o=nearestObj();if(o)o.act();}\nfunction tryStairs(up){if(player.climb||dlg)return false;\n  if(up&&player.floor===0&&Math.abs(player.x-STAIR.bx)\u003c10){player.goal=null;player.x=STAIR.bx;player.climb={p:0,up:true};return true;}\n  if(!up&&player.floor===1&&Math.abs(player.x-STAIR.tx)\u003c10){player.goal=null;player.x=STAIR.tx;player.climb={p:0,up:false};return true;}\n  if(!player.climb&&player.floor===(up?0:1)){player.setGoal(up?1:0,player.x,null);} // auto-walk via stairs\n  return false;}\nfunction keyDown(k){\n  if(['ArrowUp','w','W'].includes(k))tryStairs(true);\n  else if(['ArrowDown','s','S'].includes(k))tryStairs(false);\n  else if(['e','E',' ','Enter'].includes(k))interact();\n  else if(k==='m'||k==='M')toggleMute();\n  keys.add(k);\n}\naddEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;keyDown(e.key);});\naddEventListener('keyup',e=>keys.delete(e.key));\ndocument.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;\n  b.addEventListener('pointerdown',e=>{e.preventDefault();keyDown(k);});\n  const up=()=>keys.delete(k);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});\ndlgEl.addEventListener('click',e=>{e.stopPropagation();advance();});\nfunction toggleMute(){muted=!muted;document.getElementById('mute').textContent=muted?'♪ Ton aus':'♪ Ton an';}\ndocument.getElementById('mute').onclick= ent=`${hover.name} · ${hover.activity||''}`;place(e,hover.x,hover.y-17);}else hide('hover');\n  if(!started){started=true;setTimeout(()=>{if(!dlg)narrate(['Willkommen im Klanghaus! Sechs Leute, drei Studios, eine Küche und ziemlich viele Hühner.','Laufen mit ← →, Treppe mit ↑ ↓, sprechen mit E – oder einfach klicken.'],'KLANGHAUS');},600);}\n  requestAnimationFrame(loop);\n}\nbuildStatic();resize();\ndocument.fonts&&document.fonts.ready.then(resize);\nrequestAnimationFrame(loop);\n\u003c/script>\n\u003cscript>parent.postMessage({arc:'ready'},'*');['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});document.documentElement.style.touchAction='pan-x pan-y';\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

/* ---------- touch: tap things instead of pressing ENTER ----------
   A tap on an object within reach uses it (hens, doors, the computer, the map board, bench, hammock, garage, arcade, car...).
   A tap anywhere also moves dialogue on, skips the arrival cutscene and gets you up from the bench or hammock.
   The "ENTER · ..." label itself can be tapped too; thought bubbles and tips close when tapped. */
cv.addEventListener('pointerdown', e => {
  if (!touchMode || story.mg || ovOpen || menuOpen || story.fadeDir !== 0) return;
  if (dlg.open) { e.preventDefault(); advance(); return; }
  if (story.cut || p.rest) { e.preventDefault(); onUse(); return; }
  const rc = cv.getBoundingClientRect(), sc = cv.clientWidth / VW, wx = (e.clientX - rc.left) / sc + view.cx, wy = (e.clientY - rc.top) / sc + view.cy;
  let best = null, bd = 1e9;
  for (const it of interact) {
    if (!enabled(it)) continue;
    const q = ipos(it), d = Math.hypot(wx - q.x, wy - q.y), hit = Math.max(16, Math.min(28, it.r));
    if (d < hit && d < bd) { bd = d; best = it; }
  }
  if (!best) return;

});

function mz_placeProps(){
  const free = new Set();
  for(let y=1;y<MZ_H-1;y++) for(let x=1;x<MZ_W-1;x++) if(mz_cell(x,y)==='#') free.add(x+','+y);
  const fits=(x,y,w,h)=>{ for(let j=0;j<h;j++) for(let i=0;i<w;i++) if(!free.has((x+i)+','+(y+j))) return false; return true; };
  const counts={}, placed=[];
  for(let y=1;y<MZ_H-1;y++) for(let x=1;x<MZ_W-1;x++){
    if(!free.has(x+','+y)) continue;
    if(mz_rnd(x,y,99)<0.15) { free.delete(x+','+y); continue; } // leave some plain mz_gravel
    const near=(t)=>placed.some(([pt,px,py])=>pt===t && Math.abs(px-x)<8 && Math.abs(py-y)<6);
    const opts = MZ_PROPS.filter(([t,w,h,,max])=>(counts[t+w]||0)<max && fits(x,y,w,h) && !(w*h>=3 && near(t)));
    if(!opts.length) continue;
    const total = opts.reduce((s,o)=>s+o[3]*o[1]*o[2],0);
    let r = mz_rnd(x,y,7)*total, pick=opts[0];
    for(const o of opts){ r-=o[3]*o[1]*o[2]; if(r<=0){ pick=o; break; } }
    const [t,w,h]=pick;
    counts[t+w]=(counts[t+w]||0)+1;
    for(let j=0;j<h;j++) for(let i=0;i<w;i++) free.delete((x+i)+','+(y+j));
    placed.push([t,x,y,w,h]);
  }
  return placed;
}

function mz_buildBackground(){
  for(let y=0;y<MZ_H;y++) for(let x=0;x<MZ_W;x++){
    const c=mz_cell(x,y);
    if(c==='#'){ mz_isBorder(x,y) ? mz_fence(x,y) : mz_gravel(x,y); }
    else { mz_dirt(x,y); if(mz_isBlocker(x,y)) mz_blocker(x,y); if(c==='G') mz_goalTile(x,y); if(c==='S') mz_startTile(x,y); if(c==='E') mz_entryTile(x,y); }
  }
  for(const [type,tx,ty,tw] of mz_placeProps()) mz_PROP_DRAW[type](tx*MZ_TS,ty*MZ_TS,tw*MZ_TS);
}

/* ---------- the level ---------- */
const MZ_DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const MZ_NAME = (dx, dy) => dx > 0 ? 'right' : dx < 0 ? 'left' : dy < 0 ? 'up' : 'down';
function mzBuild() { if (mz_bg) return; mz_bg = document.createElement('canvas'); mz_bg.width = MZ_W * MZ_TS; mz_bg.height = MZ_H * MZ_TS; mzb = mz_bg.getContext('2d'); mz_buildBackground(); mzSnowify(); }
/* winter: snow caps on every prop, fence and barrier (where something stands up from the ground), the gravel snowed in,
   trampled snow on the paths and snowbanks along their edges */
function mzSnowify() {
  // snow caps: wherever a prop, fence or barrier stands up from the snow, its top edge gets a cap; snowbanks along the paths
  const W = mz_bg.width, H = mz_bg.height, im = mzb.getImageData(0, 0, W, H), d = im.data;
  const SNOW = ['#eef2f7', '#dfe7f0', '#f8fafc', '#9d948a'].map(h => parseInt(h.slice(1), 16));
  const col = i => (d[i * 4] << 16) | (d[i * 4 + 1] << 8) | d[i * 4 + 2];
  const snow = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) snow[i] = SNOW.includes(col(i)) ? 1 : 0;
  const put = (x, y, h) => { const i = (y * W + x) * 4, v = parseInt(h.slice(1), 16); d[i] = v >> 16; d[i + 1] = (v >> 8) & 255; d[i + 2] = v & 255; d[i + 3] = 255; };
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (snow[i] || !snow[i - W]) continue;
    const tx = x / MZ_TS | 0, ty = y / MZ_TS | 0; if (mz_walkable(tx, ty)) continue; // only on things standing in the snow
    put(x, y, '#f7f9fc'); if (y + 1 < H && !snow[i + W] && mz_rnd(x, y, 3) < 0.6) put(x, y + 1, '#dfe7f0');
  }
  for (let ty = 0; ty < MZ_H; ty++) for (let tx = 0; tx < MZ_W; tx++) { // snowbanks: an uneven white rim where a path meets the snow
    if (!mz_walkable(tx, ty)) continue; const ox = tx * MZ_TS, oy = ty * MZ_TS;
    for (let k = 0; k < MZ_TS; k++) {
      const a = 1 + (mz_rnd(tx * 16 + k, ty, 11) < 0.45 ? 1 : 0);
      if (!mz_walkable(tx, ty - 1)) for (let j = 0; j < a; j++) put(ox + k, oy + j, j ? '#dfe7f0' : '#f4f7fb');
      if (!mz_walkable(tx, ty + 1)) for (let j = 0; j < a; j++) put(ox + k, oy + MZ_TS - 1 - j, j ? '#dfe7f0' : '#f4f7fb');
      if (!mz_walkable(tx - 1, ty)) for (let j = 0; j < a; j++) put(ox + j, oy + k, j ? '#dfe7f0' : '#f4f7fb');
      if (!mz_walkable(tx + 1, ty)) for (let j = 0; j < a; j++) put(ox + MZ_TS - 1 - j, oy + k, j ? '#dfe7f0' : '#f4f7fb');
    }
  }
  mzb.putImageData(im, 0, 0);
}
function mzStart() {
  mzBuild(); story.place = 'station'; qSig = '#'; near = null; story.think = 0; try { $('think').hidden = true; } catch (e) {}
  story.recording = null; try { $('rec').hidden = true; } catch (e) {}
  story.mg = { mz: true, phase: 'play', t: 0, pops: [] }; mzReset(story.mg);
}
function mzReset(m) { // (also after being caught) the player walks in through the gate at the bottom left
  m.P = { fx: MZ_START_X(), fy: MZ_START_Y(), tx: MZ_START_X(), ty: MZ_START_Y(), t: 0, dx: 0, dy: -1, moving: false, face: 'right', anim: 0 };
  m.bolts = mz_reachable(); m.bolts.delete(mz_START.x + ',' + mz_START.y); m.bolts.delete(mz_GOAL.x + ',' + mz_GOAL.y); m.total = m.bolts.size;
  m.trail = []; m.el = 0; m.started = false; m.Gs = MZ_GUARDS.map(g => ({ ...g, gi: 0, shown: false, x: 0, y: 0, face: 'right', moving: false, anim: 0 })); m.G = m.Gs[0]; m.gShown = false;
  m.bumpCd = {}; m.phase = 'enter'; m.wt = 0; m.camY = mzCamTarget(m);
  noiseHit(0.25, 0.04, 700, 3); // the gate creaks
}
const MZ_START_X = () => mz_START.x, MZ_START_Y = () => mz_START.y;
function mzHeldList() { return ['up', 'down', 'left', 'right'].filter(d => down(d)); }
// one direction from what is held: while moving, a held turn that is open wins (the original's cornering help); else the current one
function mzHeld(m) {
  const hs = mzHeldList(); if (!hs.length) return null; if (hs.length === 1) return hs[0];
  const P = m.P, cur = MZ_NAME(P.dx, P.dy);
  const turn = hs.find(d => d !== cur && mz_walkable(P.fx + MZ_DIRS[d][0], P.fy + MZ_DIRS[d][1])); if (turn) return turn;
  return hs.includes(cur) ? cur : hs[0];
}
